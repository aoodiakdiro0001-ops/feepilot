const mt=(document.getElementById(which==='s'?'sMT':'fMT')||{}).value||'taker';
const base=which==='s'?(mt==='maker'?ex.sm:ex.st):(mt==='maker'?ex.fm:ex.ft);
document.getElementById(which==='s'?'sFee':'fFee').value=base;
}
function fillAll(){
const opts=EX.map((e,i)=>`<option value="${i}">${e.n}</option>`).join('');
document.getElementById('sEx').innerHTML=opts;document.getElementById('fEx').innerHTML=opts;
fillFees('s');fillFees('f');
}
function calcSpot(){
const ex=EX[document.getElementById('sEx').selectedIndex]||EX[0];
const side=document.getElementById('sSide').value,mt=document.getElementById('sMT').value;
const q=num('sQty'),p=num('sPrice');
const base=num('sFee'),tok=num('sTok'),ref=num('sRef');
const r=effRate(base,tok,ref),not=q*p,fee=not*r/100;
const tot=side==='buy'?not+fee:not-fee;
document.getElementById('spotRes').innerHTML=`${t('fEx')}: <b>${ex.n}</b> · ${mt}<br>${t('outT')}: <b>$${tot.toLocaleString('en-US',{maximumFractionDigits:2})}</b><br><small>fee ${r.toFixed(4)}% = $${fee.toFixed(2)} · notional $${not.toLocaleString('en-US',{maximumFractionDigits:2})}</small>`;
return {not,fee,tot,r};
}
function calcFut(){
const ex=EX[document.getElementById('fEx').selectedIndex]||EX[0];
const not=num('fNot'),lev=Math.max(1,num('fLev',1));
const base=num('fFee'),fund=num('fFund');
const open=not*base/100,close=not*base/100,fundC=not*fund/100;
const margin=not/lev,total=open+close+fundC;
document.getElementById('futRes').innerHTML=`${t('fEx')}: <b>${ex.n}</b> · x${lev}<br>${t('outT')}: <b>$${total.toFixed(2)}</b><br><small>open $${open.toFixed(2)} + close $${close.toFixed(2)} + funding $${fundC.toFixed(2)} · margin $${margin.toFixed(2)}</small>`;
return {total,margin};
}
function calcSwap(){
const amt=num('wAmt'),net=num('wNet'),plat=num('wPlat'),slip=num('wSlip');
const afterNet=Math.max(0,amt-net);
const afterPlat=afterNet*(1-plat/100);
const recv=afterPlat*(1-slip/100);
const eff=amt>0?(1-recv/amt)*100:0;
const warn=slip>5||(slip>2&&amt>5000);
document.getElementById('swapRes').innerHTML=`${t('outT')}: <b>$${recv.toFixed(2)}</b><br><small>−$${net.toFixed(2)} net −${plat}% −${slip}% slip · eff. cost ${eff.toFixed(2)}%${warn?' · ⚠️':''}</small>`;
return {recv,eff};
}
function refFor(n){return (CONFIG.refs&&CONFIG.refs[n.toLowerCase()])||EX.find(e=>e.n===n).u;}
function isRef(n){return !!(CONFIG.refs&&CONFIG.refs[n.toLowerCase()]);}
function renderCmp(){
const not=num('cNot',10000),mt=(document.getElementById('cMT')||{}).value||'taker';
const tok=num('sTok'),ref=num('sRef');
const rows=EX.map(e=>{const base=mt==='maker'?e.sm:e.st;const r=effRate(base,tok,ref);return {n:e.n,r,cost:not*r/100};});
rows.sort((a,b)=>a.cost-b.cost);
document.getElementById('cmpBody').innerHTML=rows.map((x,i)=>`<tr${i===0?' class="win"':''}><td><b>${i===0?'🥇 ':''}${x.n}</b></td><td>${x.r.toFixed(3)}%</td><td>$${x.cost.toFixed(2)}</td><td><a target="_blank" rel="nofollow sponsored noopener" href="${refFor(x.n)}">${t('refOff')}${isRef(x.n)?' ★':''}</a></td></tr>`).join('');
}
function renderRefs(){
document.getElementById('refList').innerHTML=EX.map(e=>{const has=isRef(e.n);
return `<div class="excard"><span class="nm">${e.n}</span><span class="fees">spot ${e.sm}/${e.st}% · fut ${e.fm}/${e.ft}%${has?`<span class="refbadge">${t('refOn')}</span>`:''}</span><a target="_blank" rel="nofollow sponsored noopener" href="${refFor(e.n)}">${t('refOff')} →</a></div>`;}).join('');
}
function renderDonate(){
document.getElementById('btcA').textContent=CONFIG.pay.btc;
document.getElementById('usdtA').textContent=CONFIG.pay.usdt;
}
function loadAds(){const A=CONFIG.ads,el=document.getElementById('adFoot');if(!el)return;
if(A.client){el.innerHTML='<ins class="adsbygoogle" style="display:block" data-ad-client="'+A.client+'" data-ad-slot="'+(A.slot||'')+'" data-ad-format="auto"></ins>';
if(!document.querySelector('script[src*="adsbygoogle"]')){const s=document.createElement('script');s.async=true;s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+A.client;s.crossOrigin='anonymous';document.head.appendChild(s);}try{(window.adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}}
else if(A.carbonServe){el.innerHTML='';const s=document.createElement('script');s.async=true;s.id='_carbonads_js';s.src='//cdn.carbonads.com/carbon.js?serve='+A.carbonServe+'&placement='+A.carbonPlacement;el.appendChild(s);}}
setLang('en');loadAds();renderDonate();
</script>
